name: Collect Telegram Posts & Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Telegram posts
        id: fetch
        uses: razdfeed/razdfeed-telegram-fetcher-action@main
        with:
          channel: 'dealenxdev'
          output: 'public/telegram_posts.json'
          max-pages: '0'
          delay: '400'
        env:
          BASE_URL: 'https://dealenx.github.io/razdfeed'

      - name: Print summary
        run: echo "Collected ${{ steps.fetch.outputs.posts-count }} posts"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4